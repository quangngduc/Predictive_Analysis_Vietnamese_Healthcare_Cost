name: Run Healthcare Cost Model

on:
  workflow_dispatch:    # Allows manual start from GitHub UI
  # push:               # Uncomment if you want it to run on every code push
  # schedule:
  #   - cron: '0 2 * * *'  # Uncomment to run daily at 2 AM

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # 6 hours max (GitHub limit)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install required R packages
        run: |
          Rscript -e "install.packages(c('tidyverse', 'readr', 'fastDummies', 'xgboost', 'caret', 'rmarkdown'), repos='https://cloud.r-project.org/')"

      - name: Run R script
        run: Rscript -e "rmarkdown::render('train_caret_improved.Rmd', quiet = TRUE)"

      - name: Upload submission file
        uses: actions/upload-artifact@v4
        with:
          name: submission-results
          path: submission.csv